openapi: 3.0.3
info:
  title: New API Seed Dance Video API
  version: 1.0.0
  license:
    name: GNU Affero General Public License v3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
  description: |
    OpenAI-compatible video generation contract for the Seed Dance channel.
    Task identifiers in this document are public New API identifiers; upstream
    provider identifiers are never exposed.
servers:
  - url: "{{base_url}}"
tags:
  - name: Videos
    description: Create, inspect, and download video-generation tasks.
paths:
  /v1/videos:
    post:
      tags: [Videos]
      summary: Create a video task
      operationId: createVideo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoCreateJSON"
            example:
              model: seedance-uncensored
              prompt: TEST_PROMPT
              duration: 10
              size: 1280x720
              metadata:
                prompt_optimization: false
                multi_shot: false
                strict_duration: false
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/VideoCreateMultipart"
            example:
              model: seedance-uncensored
              prompt: TEST_PROMPT
              duration: "10"
              size: 1280x720
              metadata: '{"prompt_optimization":"false","multi_shot":"false","strict_duration":"true","negative_prompt":""}'
              input_reference: FILE_BYTES
      responses:
        "200":
          description: Video task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIVideo"
              example:
                id: "{{task_id}}"
                task_id: "{{task_id}}"
                object: video
                model: seedance-uncensored
                status: queued
                progress: 10
                created_at: 1753372800
                seconds: "10"
                size: 720P
        "400":
          $ref: "#/components/responses/SubmitBadRequest"
        "401":
          $ref: "#/components/responses/SubmitUnauthorized"
        "403":
          $ref: "#/components/responses/SubmitForbidden"
        "429":
          $ref: "#/components/responses/TaskRateLimited"
        "502":
          $ref: "#/components/responses/SubmitOutcomeUnknown"
        "503":
          $ref: "#/components/responses/ModelUnavailable"
  /v1/videos/{task_id}:
    get:
      tags: [Videos]
      summary: Get video task status
      operationId: getVideo
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Current public video task state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIVideo"
              example:
                id: "{{task_id}}"
                task_id: "{{task_id}}"
                object: video
                model: seedance-uncensored
                status: in_progress
                progress: 30
                created_at: 1753372800
                seconds: "10"
                size: 720P
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/TaskReadError"
  /v1/videos/{task_id}/content:
    get:
      tags: [Videos]
      summary: Download completed video content
      operationId: getVideoContent
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: |
            Validated MP4 content for a completed task. The provider response
            may contain only requestId and video_base64; New API validates and
            decodes it before returning this binary response.
          headers:
            Content-Length:
              description: Decoded MP4 size in bytes.
              schema:
                type: integer
                minimum: 0
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/ContentRateLimited"
        "502":
          $ref: "#/components/responses/ContentUpstreamError"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      description: Public New API task identifier.
      schema:
        type: string
      example: "{{task_id}}"
  responses:
    SubmitBadRequest:
      description: The submit payload was malformed or failed Seed Dance validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          examples:
            malformedRequest:
              summary: Malformed JSON or a missing/non-string model
              value:
                error:
                  message: Invalid request
                  type: new_api_error
                  code: ""
            invalidParameter:
              summary: Seed Dance parameter validation failed
              value:
                error:
                  message: duration must be between 1 and 15
                  type: invalid_request_error
                  code: invalid_duration
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          example:
            error:
              message: duration must be between 1 and 15
              type: invalid_request_error
              code: invalid_duration
    SubmitUnauthorized:
      description: |
        Client authentication failed, or the upstream generate request returned
        HTTP 401. These cases intentionally preserve their distinct runtime
        error types and codes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          examples:
            clientAuthentication:
              summary: Invalid New API client credential
              value:
                error:
                  message: Invalid API key
                  type: new_api_error
                  code: ""
            upstreamAuthentication:
              summary: The Seed Dance provider rejected its stored credential
              value:
                error:
                  message: Upstream authentication failed
                  type: invalid_request_error
                  code: upstream_authentication_error
    SubmitForbidden:
      description: The upstream generate request returned HTTP 403.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          example:
            error:
              message: Upstream authentication failed
              type: invalid_request_error
              code: upstream_authentication_error
    Unauthorized:
      description: New API client authentication failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          example:
            error:
              message: Invalid API key
              type: new_api_error
              code: ""
    NotFound:
      description: The public task does not exist or is not owned by the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          example:
            error:
              message: Video task not found
              type: invalid_request_error
              code: task_not_found
    TaskRateLimited:
      description: The video task request was rate limited.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          example:
            error:
              message: Too many requests
              type: rate_limit_error
              code: upstream_rate_limit_error
    ContentRateLimited:
      description: The upstream video-content request was rate limited.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          example:
            error:
              message: Upstream rate limit exceeded
              type: upstream_rate_limit_error
              code: upstream_rate_limit_error
    SubmitOutcomeUnknown:
      description: |
        The generate request had an ambiguous outcome, including connection
        interruption, timeout, upstream 502/503/504, or a lost response. New
        API returns HTTP 502 and does not retry automatically because a paid
        upstream task might already exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          examples:
            outcomeUnknown:
              summary: The paid-task creation outcome cannot be determined safely
              value:
                error:
                  message: Seed Dance submit outcome is unknown
                  type: server_error
                  code: seedance_submit_outcome_unknown
            businessFailure:
              summary: HTTP 200 carried an explicit provider business failure
              value:
                error:
                  message: Upstream video service rejected the task
                  type: server_error
                  code: upstream_error
    ModelUnavailable:
      description: No enabled channel can route the requested model.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          example:
            error:
              message: The model seedance-uncensored has no available channel
              type: new_api_error
              code: model_not_found
    TaskReadError:
      description: The persisted task snapshot could not be read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          example:
            error:
              message: Failed to get video task
              type: server_error
              code: get_task_failed
    ContentUpstreamError:
      description: |
        The content proxy could not restore its channel state, connect to the
        provider, or validate the provider JSON, Base64, or MP4 response.
        Runtime error codes distinguish these cases.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          example:
            error:
              message: Invalid upstream video response
              type: invalid_upstream_response
              code: invalid_upstream_response
    UpstreamTimeout:
      description: The upstream provider did not complete within the deadline.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          example:
            error:
              message: Upstream video service timed out
              type: upstream_timeout_error
              code: upstream_timeout_error
  schemas:
    VideoCreateJSON:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          enum:
            - seedance-uncensored
          description: Model routed to the Seed Dance channel.
          example: seedance-uncensored
        prompt:
          type: string
          minLength: 1
          pattern: "\\S"
          description: Video-generation prompt; it must remain non-empty after trimming.
          example: TEST_PROMPT
        duration:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 15
            - type: string
              pattern: "^[0-9]+$"
          default: 15
          description: |
            Requested duration in seconds. Decimal digit strings are parsed as
            integers and the parsed value must be between 1 and 15.
          example: 10
        seconds:
          description: |
            Alias for duration. Decimal digit strings are parsed as integers
            and the parsed value must be between 1 and 15.
          oneOf:
            - type: integer
              minimum: 1
              maximum: 15
            - type: string
              pattern: "^[0-9]+$"
          example: "10"
        size:
          type: string
          enum:
            - 854x480
            - 480x854
            - 480P
            - 1280x720
            - 720x1280
            - 720P
            - 1920x1080
            - 1080x1920
            - 1080P
          description: |
            Output-resolution alias. Runtime matching trims surrounding
            whitespace and is case-insensitive. Text-to-video rejects 480P.
          example: 1280x720
        image:
          type: string
          description: A pure Base64 image, supported image data URI, or remote image URL.
          example: IMAGE_REFERENCE
        images:
          type: array
          maxItems: 1
          description: Single-item image-reference alias.
          items:
            type: string
          example:
            - IMAGE_REFERENCE
        input_reference:
          type: string
          description: Image-reference alias for JSON requests.
          example: IMAGE_REFERENCE
        metadata:
          $ref: "#/components/schemas/VideoMetadata"
    VideoMetadata:
      type: object
      properties:
        duration:
          description: |
            Duration alias inside metadata. Decimal digit strings are parsed as
            integers and the parsed value must be between 1 and 15.
          oneOf:
            - type: integer
              minimum: 1
              maximum: 15
            - type: string
              pattern: "^[0-9]+$"
          example: 10
        resolution:
          type: string
          enum:
            - 854x480
            - 480x854
            - 480P
            - 1280x720
            - 720x1280
            - 720P
            - 1920x1080
            - 1080x1920
            - 1080P
          description: |
            Uses the same nine aliases, whitespace trimming, and
            case-insensitive matching as the top-level size field.
          example: 720P
        image_base64:
          type: string
          description: Seed Dance image input; no channel-specific byte ceiling is imposed.
          example: IMAGE_DATA_PLACEHOLDER
        prompt_optimization:
          type: boolean
          description: Omitted from the upstream request when not supplied.
        multi_shot:
          type: boolean
          description: Omitted from the upstream request when not supplied.
        strict_duration:
          type: boolean
          description: Omitted from the upstream request when not supplied.
        negative_prompt:
          type: string
          example: TEST_NEGATIVE_PROMPT
    VideoCreateMultipart:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          enum:
            - seedance-uncensored
          example: seedance-uncensored
        prompt:
          type: string
          minLength: 1
          pattern: "\\S"
          example: TEST_PROMPT
        duration:
          type: string
          pattern: "^[0-9]+$"
          description: Decimal digits whose parsed value must be between 1 and 15.
          example: "10"
        seconds:
          type: string
          pattern: "^[0-9]+$"
          description: Decimal-digit alias whose parsed value must be between 1 and 15.
          example: "10"
        size:
          type: string
          enum:
            - 854x480
            - 480x854
            - 480P
            - 1280x720
            - 720x1280
            - 720P
            - 1920x1080
            - 1080x1920
            - 1080P
          description: |
            Runtime matching trims surrounding whitespace and is
            case-insensitive. Text-to-video rejects 480P.
          example: 1280x720
        metadata:
          type: string
          description: JSON-encoded VideoMetadata object.
          example: '{"prompt_optimization":"false","multi_shot":"false","strict_duration":"true","negative_prompt":""}'
        image:
          type: string
          description: Text image reference using pure Base64, a supported data URI, or an HTTP(S) URL.
          example: IMAGE_REFERENCE
        images:
          type: string
          description: |
            A text image reference, a JSON-encoded single-item array, or one
            repeated text part. The normalized request may contain one image.
          example: '["IMAGE_REFERENCE"]'
        input_reference:
          description: Text image reference or a JPG/PNG file part.
          anyOf:
            - type: string
              description: Pure Base64, supported data URI, or HTTP(S) URL.
            - type: string
              format: binary
              description: JPG or PNG reference image file.
    OpenAIVideo:
      type: object
      required:
        - id
        - task_id
        - object
        - model
        - status
        - progress
        - created_at
        - seconds
        - size
      properties:
        id:
          type: string
          description: Public New API video task identifier.
          example: "{{task_id}}"
        task_id:
          type: string
          description: Public task identifier alias.
          example: "{{task_id}}"
        object:
          type: string
          enum: [video]
          example: video
        model:
          type: string
          enum:
            - seedance-uncensored
          example: seedance-uncensored
        status:
          type: string
          enum:
            - queued
            - in_progress
            - completed
            - failed
          example: queued
        progress:
          type: integer
          minimum: 0
          maximum: 100
          example: 0
        created_at:
          type: integer
          format: int64
          example: 1753372800
        completed_at:
          type: integer
          format: int64
          description: Present only when status is completed or failed.
          example: 1753372810
        expires_at:
          type: integer
          format: int64
          nullable: true
          example: 1753459200
        seconds:
          type: string
          pattern: "^[0-9]+$"
          example: "10"
        size:
          type: string
          enum:
            - 480P
            - 720P
            - 1080P
          example: 720P
        error:
          allOf:
            - $ref: "#/components/schemas/VideoTaskError"
    VideoTaskError:
      type: object
      required:
        - message
        - code
      properties:
        message:
          type: string
        code:
          type: string
    OpenAIError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
            - code
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
