name: Publish new-api-woka to Docker Hub

on:
  push:
    branches:
      - custom-main
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional additional Docker tag (for example, acceptance-20260804)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: dockerhub-new-api-woka-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # Do not publish images when this workflow is copied into another fork.
    # Manual dispatch is intentionally limited to the trusted release branch;
    # otherwise an arbitrary branch could use the Docker Hub push secret.
    if: github.repository == 'wlhtea/new-api' && github.ref == 'refs/heads/custom-main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_NAME: wlhtea/new-api-woka

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Validate credentials and prepare build version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          test "$DOCKERHUB_USERNAME" = "wlhtea" || {
            echo "::error::DOCKERHUB_USERNAME must be wlhtea for this repository"
            exit 1
          }
          test -n "$DOCKERHUB_TOKEN" || {
            echo "::error::The DOCKERHUB_TOKEN repository secret is required"
            exit 1
          }

          if [ -n "$EXTRA_TAG" ] && ! printf '%s' "$EXTRA_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::The optional Docker tag is invalid"
            exit 1
          fi
          case "$EXTRA_TAG" in
            latest|sha-*)
              echo "::error::The tags latest and sha-* are reserved"
              exit 1
              ;;
          esac

          BUILD_VERSION="$EXTRA_TAG"
          if [ -z "$BUILD_VERSION" ]; then
            BUILD_VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}"
          fi
          printf '%s\n' "$BUILD_VERSION" > VERSION
          echo "Building $IMAGE_NAME from $GITHUB_SHA"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/custom-main' }}
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push multi-architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write image summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## new-api-woka"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Tags:"
            printf '%s\n' "$IMAGE_TAGS" | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published manifests
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SHA_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_NAME:latest"
          docker buildx imagetools inspect "$IMAGE_NAME:$SHA_TAG"
